server:
  port: 8080

spring:
  web:
    error:
      include-message: always

  application:
    name: backend-springboot

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
          format_sql: true

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: 3600000 # 1 hora en milisegundos
  account:
    initial-balance: 1000.00
  exchange-service:
    url: ${EXCHANGE_SERVICE_URL:http://localhost:3000}
  finnhub:
    api-key: ${FINNHUB_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

